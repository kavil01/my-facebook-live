name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Timezone to Sri Lanka
        run: |
          sudo timedatectl set-timezone Asia/Colombo

      - name: Install Stream Tools & Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
          TZ: "Asia/Colombo"
        run: |
          # 1. Virtual Screen (1280x720)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Chrome Automation Detection-ஐ முற்றிலும் தவிர்க்கும் பிரவுசர் கட்டளை
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-blink-features=AutomationControlled \
            --disable-infobars \
            --excludeSwitches="enable-automation" \
            --useAutomationExtension=false \
            --kiosk \
            --window-size=1280,720 \
            --window-position=0,0 \
            "https://newtamiil.blogspot.com/" &

          # வலைத்தளம் லோட் ஆக காத்திருத்தல்
          sleep 20

          # 3. துல்லியமாக Player பகுதி மட்டும் வெட்டப்பட்டு ஸ்ட்ரீம் செய்யப்படும்
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=1020:600:130:60,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
