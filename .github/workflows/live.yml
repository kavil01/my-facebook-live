name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stream Tools & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser xdotool python3-pip
          pip3 install yt-dlp

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Screen அமைத்தல்
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Chromium-ஐ Flags உடன் இயக்குதல் (Bypass Detection)
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --disable-dev-shm-usage \
            --disable-accelerated-2d-canvas \
            --disable-gpu \
            --disable-blink-features=AutomationControlled \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --window-size=1280,720 \
            --start-fullscreen \
            "https://newtamiil.blogspot.com/" &

          # பிரவுசர் லோட் ஆக 30 வினாடிகள் காத்திருத்தல்
          sleep 30

          # 3. FFmpeg Crop மற்றும் Facebook Live ஸ்ட்ரீமிங்
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=850:480:215:150,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
