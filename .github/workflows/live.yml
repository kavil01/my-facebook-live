name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Stream Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgbm-dev
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth --unsafe-perm=true

      - name: Create Player HTML Page
        run: |
          cat << 'EOF' > player.html
          <!DOCTYPE html>
          <html lang="ta">
          <head>
            <meta charset="UTF-8">
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body { background: #000; color: #fff; font-family: Arial, sans-serif; overflow: hidden; }
              .tv-container { position: relative; width: 1280px; height: 720px; background: #000; }
              .video-screen { position: absolute; top: 0; left: 0; width: 100%; height: 675px; }
              .video-screen iframe { width: 100%; height: 100%; border: none; }
              .live-tag { position: absolute; top: 15px; left: 15px; z-index: 10; background: #ff0000; color: #fff; padding: 5px 12px; font-weight: bold; font-size: 14px; border-radius: 4px; }
              .channel-logo { position: absolute; top: 15px; right: 15px; z-index: 10; background: rgba(0,0,0,0.7); padding: 5px 12px; border-radius: 4px; border: 1px solid #ff0000; font-weight: bold; }
              .live-clock { position: absolute; bottom: 55px; right: 15px; z-index: 10; background: rgba(0,0,0,0.8); color: #00ffcc; padding: 4px 8px; font-family: monospace; font-size: 14px; border-radius: 4px; }
              .ticker-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 45px; background: #cc0000; display: flex; align-items: center; z-index: 10; }
              .ticker-title { background: #000; color: #fff; padding: 0 15px; height: 100%; display: flex; align-items: center; font-weight: bold; font-size: 15px; white-space: nowrap; }
              .ticker-content { overflow: hidden; white-space: nowrap; width: 100%; }
              .ticker-text { display: inline-block; padding-left: 100%; animation: marquee 20s linear infinite; font-size: 18px; font-weight: bold; color: #fff; }
              @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
            </style>
          </head>
          <body>
            <div class="tv-container">
              <div class="live-tag">● LIVE TV</div>
              <div class="channel-logo">KING TAMIL TV</div>
              <div class="video-screen">
                <!-- இங்கு உங்கள் Youtube/Live Stream URL-ஐ மாற்றிக்கொள்ளலாம் -->
                <iframe src="https://www.youtube.com/watch?v=UuCnb6zpdFg" allow="autoplay; encrypted-media" allowfullscreen></iframe>
              </div>
              <div class="live-clock" id="clock">00:00:00 AM</div>
              <div class="ticker-bar">
                <div class="ticker-title">BREAKING NEWS</div>
                <div class="ticker-content">
                  <div class="ticker-text">தடையில்லா நேரலை செய்திகள் மற்றும் முக்கிய நிகழ்வுகள் | King Tamil TV Live Streaming</div>
                </div>
              </div>
            </div>
            <script>
              function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12 || 12;
                document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
              }
              setInterval(updateClock, 1000);
              updateClock();
            </script>
          </body>
          </html>
          EOF

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Screen (1280x720)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Local Player HTML-ஐ Stealth Mode-இல் லோட் செய்தல்
          node -e '
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          const path = require("path");
          puppeteer.use(StealthPlugin());

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled",
                "--window-size=1280,720"
              ]
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            const filePath = "file://" + path.resolve("player.html");
            await page.goto(filePath, { waitUntil: "networkidle2" });
          })();
          ' &

          sleep 15

          # 3. Stream to Facebook Live (துல்லியமான 1280x720 Full Screen)
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
