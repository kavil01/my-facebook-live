name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgbm-dev
          npm init -y
          npm install puppeteer --unsafe-perm=true

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Screen தொடங்குதல்
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Puppeteer மூலம் வலைத்தளத்தை முழுமையாக லோட் செய்தல்
          node -e '
          const puppeteer = require("puppeteer");
          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-infobars",
                "--window-size=1280,720",
                "--user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              ]
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            await page.goto("https://newtamiil.blogspot.com/", { waitUntil: "networkidle2", timeout: 90000 });
            console.log("Website Fully Loaded!");
          })();
          ' &

          # வலைத்தளம் மற்றும் வீடியோ லோட் ஆக 30 வினாடிகள் காத்திருத்தல்
          sleep 30

          # 3. Player பகுதியை மட்டும் துல்லியமாக Crop செய்து Live அனுப்புதல்
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=1000:580:140:100,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
