name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Timezone to Sri Lanka
        run: |
          sudo timedatectl set-timezone Asia/Colombo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Stream Tools & Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgbm-dev
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth --unsafe-perm=true

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
          TZ: "Asia/Colombo"
        run: |
          # 1. Virtual Screen (1280x720)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Puppeteer Script: Automatic Accept & Fullscreen Player
          node -e '
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          puppeteer.use(StealthPlugin());

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--no-first-run",
                "--no-default-browser-check",
                "--autoplay-policy=no-user-gesture-required",
                "--window-size=1280,720"
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1280, height: 720 });
            
            // Go to Blogspot Site
            await page.goto("https://newtamiil.blogspot.com/", { waitUntil: "networkidle2", timeout: 60000 });

            // Handle Accept Dialog if present
            try {
              const acceptBtn = await page.$("button, input[type=button]");
              if(acceptBtn) await acceptBtn.click();
            } catch(e) {}

            await new Promise(r => setTimeout(r, 10000));
          })();
          ' &

          # லோடிங் நிறைவடைய காத்திருத்தல்
          sleep 25

          # 3. துல்லியமாக Yellow Box Player பகுதி மட்டும் Crop செய்யப்பட்டு ஸ்ட்ரீம் செய்யப்படும்
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=1020:600:130:60,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
