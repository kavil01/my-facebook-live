name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stream Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Screen தொடங்குதல்
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Browser-இல் Webpage திறத்தல்
          chromium-browser --no-sandbox --disable-setuid-sandbox --window-size=1280,720 --start-fullscreen "https://newtamiil.blogspot.com/" &

          sleep 15

          # 3. FFmpeg Command (காரணம்: Filter மற்றும் Input ஆப்ஷன்கள் சரியான வரிசையில் வைக்கப்பட்டுள்ளன)
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=1020:600:130:90,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
