name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Timezone to Sri Lanka
        run: |
          sudo timedatectl set-timezone Asia/Colombo

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Stream Tools & Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb libgbm-dev
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth --unsafe-perm=true

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
          TZ: "Asia/Colombo"
        run: |
          # 1. Virtual Screen (1280x720)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Advanced Bot Bypass Puppeteer Script
          node -e '
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          puppeteer.use(StealthPlugin());

          (async () => {
            const browser = await puppeteer.launch({
              headless: false,
              executablePath: "/usr/bin/google-chrome",
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-blink-features=AutomationControlled",
                "--disable-web-security",
                "--allow-running-insecure-content",
                "--autoplay-policy=no-user-gesture-required",
                "--window-size=1280,720"
              ]
            });

            const page = await browser.newPage();
            
            // Custom Headers to bypass Bot Detection
            await page.setExtraHTTPHeaders({
              "accept-language": "en-US,en;q=0.9,ta;q=0.8"
            });
            
            await page.setViewport({ width: 1280, height: 720 });
            await page.goto("https://newtamiil.blogspot.com/", { waitUntil: "networkidle2", timeout: 90000 });
          })();
          ' &

          sleep 25

          # 3. Stream to Facebook Live (உங்களின் தற்போதைய Crop Alignment-க்கு ஏற்றவாறு)
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=1100:620:90:50,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
