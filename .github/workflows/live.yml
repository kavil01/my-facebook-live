name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python, Playwright & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          python3 -m pip install --upgrade pip
          pip install playwright playwright-stealth
          playwright install chromium
          playwright install-deps

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Screen (1280x720)
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Python Script மூலம் reCAPTCHA-வை தடுத்து Webpage திறத்தல்
          python3 -c '
          import time
          from playwright.sync_api import sync_playwright
          from playwright_stealth import stealth_sync

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=False,
                  args=[
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-blink-features=AutomationControlled",
                      "--window-size=1280,720"
                  ]
              )
              context = browser.new_context(
                  viewport={"width": 1280, "height": 720},
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              stealth_sync(page)
              page.goto("https://newtamiil.blogspot.com/", wait_until="networkidle", timeout=90000)
              time.sleep(3000)
          ' &

          sleep 25

          # 3. துல்லியமான Crop மற்றும் Live Stream
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=850:480:215:150,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
