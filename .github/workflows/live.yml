name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stream Tools & Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb chromium-browser xdotool

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Screen அமைத்தல்
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99

          # 2. Chromium பிரவுசரைத் திறத்தல்
          chromium-browser \
            --no-sandbox \
            --disable-setuid-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-blink-features=AutomationControlled \
            --disable-infobars \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            --window-size=1920,1080 \
            --start-fullscreen \
            "https://newtamiil.blogspot.com/" &

          sleep 5

          # Pop-up ஏதேனும் வந்தால் நீக்குதல்
          xdotool key Return
          sleep 2
          xdotool key Return

          sleep 20

          # 3. FFmpeg Crop: சிவப்புக் கோட்டுப் பிளேயர் பகுதி மட்டும் துல்லியமாக Crop செய்யப்படும்
          ffmpeg -f x11grab -r 30 -s 1920x1080 -i :99.0 \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -vf "crop=1150:660:385:210,scale=1280:720" \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
