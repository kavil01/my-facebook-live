name: Website Player Only Facebook Live

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  stream-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Start Live Stream
        env:
          FB_KEY: ${{ secrets.FB_STREAM_KEY }}
        run: |
          # 1. Virtual Display தொடங்குதல்
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99

          # 2. Chrome பிரவுசரில் உங்கள் இணையதளத்தைத் திறத்தல்
          google-chrome-stable --no-sandbox --disable-setuid-sandbox --window-size=1280,720 --start-fullscreen "https://newtamiil.blogspot.com/" &

          # பிரவுசர் முழுமையாக லோட் ஆக 20 வினாடிகள் காத்திருத்தல்
          sleep 20

          # 3. FFmpeg மூலம் பிளேயர் பகுதியை மட்டும் Crop செய்து Facebook-க்கு அனுப்புதல்
          ffmpeg -f x11grab -r 30 -s 1280x720 -i :99.0 \
          -vf "crop=1020:600:130:90,scale=1280:720" \
          -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
          -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 60 -b:v 2500k \
          -c:a aac -b:a 128k \
          -f flv "rtmps://live-api-s.facebook.com:443/rtmp/${FB_KEY}"
